# Base de datos para desarrollo local. Spring Boot la levanta sola al ejecutar la app
# (dependencia spring-boot-docker-compose); también se puede usar `docker compose up -d`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tiendas
      POSTGRES_USER: tiendas
      POSTGRES_PASSWORD: tiendas
    ports:
      - "5432:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql

  # Buzón de prueba: atrapa los mails que manda la app (SMTP en :1025) y los muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-datos:
